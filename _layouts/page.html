---
layout: default
---
<main class="page">
  <div class="icon" aria-hidden="true">{{ page.icon | default: site.title | slice: 0 }}</div>
  <h1 class="title">{{ page.title }}</h1>
  {%- if page.description %}
  <p class="tagline">{{ page.description }}</p>
  {%- endif %}
  {{ content }}
  <div class="foot">{{ site.author.name }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></div>
</main>
